# CI: keep the Ubuntu code paths from rotting. The ubuntu job is the
# deployment truth (the target platform); the macos job guards the
# development platform. Both drive deploy/build-linux.sh, which builds
# the library, every deployable tool, and runs every test binary
# (the LaTeX/bibliography checks need a TeX toolchain and stay local).
#
# The build-consistency job runs first and cheaply: it catches make
# targets renamed out from under these scripts (which once silently
# disabled every Linux gate) and suites added to `make check` that CI
# never learned to run.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly full-valgrind sweep, Mondays 04:00 UTC

jobs:
  build-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: make targets referenced by CI and deploy scripts resolve
        run: python3 tests/check_targets.py

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build and test (Linux)
        run: sh deploy/build-linux.sh
      - name: nettest selftest
        run: ./nettest --selftest

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: build and test (macOS)
        run: sh deploy/build-linux.sh
      - name: nettest selftest
        run: ./nettest --selftest

  ubuntu-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build and test under ASan+UBSan
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: sh deploy/build-linux.sh
      - name: live-stack stress under ASan (fuzz + live calibration)
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          make genframes
          sh deploy/stress-live.sh 1

  ubuntu-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: live stack under ThreadSanitizer
        # only the hub is TSan-instrumented: it is the threaded program
        # under test, and its own threading stays fully visible; the
        # single-threaded peripherals link plain
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: |
          make libmv.a replaycam nettest genframes
          rm -f tools/livehub.o tools/hub_clock.o tools/hub_solve.o
          CFLAGS="-std=c99 -pedantic -Wall -Wextra -O1 -g -fsanitize=thread" make hubengine
          sh deploy/stress-live.sh 0

  ubuntu-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build and run suites with coverage
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -O0 -g --coverage
        run: sh deploy/build-linux.sh
      - name: coverage report
        # suspicious_hits.warn: the full-HD reader tests legitimately
        # run src/reader.c's innermost pixel loop ~5.2e9 times, over
        # gcovr's 2^32 "suspicious hit" threshold, so it aborts the
        # report assuming gcov bug 68080. That bug yields counts in the
        # SAME range as our real ones, so no threshold can separate
        # them -- downgrade to a warning rather than pretend otherwise.
        # Coverage is a report, not a gate; the correctness gates are
        # the sanitizer, valgrind and fuzz jobs.
        run: |
          pip install gcovr >/dev/null
          mkdir -p covhtml
          GCOVR_FLAGS="--gcov-ignore-parse-errors suspicious_hits.warn"
          gcovr -r . $GCOVR_FLAGS --filter 'src/' --filter 'include/' \
                --html-details covhtml/index.html \
                --print-summary
          echo '## Coverage (src/, line/branch)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          gcovr -r . $GCOVR_FLAGS --filter 'src/' \
                >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: covhtml/

  ubuntu-valgrind:
    # memcheck catches uninitialized reads the sanitizers cannot; its
    # 20-50x slowdown limits the per-push run to the quick suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: build (plain -O1 -g)
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -O1 -g
        run: make test_session test_optimal test_feat test_mux test_photo test_sync test_track nettest
      - name: valgrind quick suites
        run: |
          for t in test_session test_optimal test_feat test_mux test_photo \
                   test_sync test_track; do
            echo "=== valgrind $t ==="
            valgrind --error-exitcode=1 --leak-check=full \
                     --errors-for-leak-kinds=definite ./$t || exit 1
          done
          valgrind --error-exitcode=1 --leak-check=full \
                   --errors-for-leak-kinds=definite ./nettest --selftest
      - name: build live tools
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -O1 -g
        run: make libmv.a hubengine replaycam nettest genframes
      - name: valgrind the live hub (memcheck on the streaming path)
        run: sh deploy/valgrind-hub.sh

  ubuntu-valgrind-full:
    # the heavy suites (LM, bundle, renders) weekly or on demand
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - name: build (plain -O1 -g)
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -O1 -g
        run: make test_mv test_refine test_bundle
      - name: valgrind heavy suites
        run: |
          for t in test_mv test_refine test_bundle; do
            echo "=== valgrind $t ==="
            valgrind --error-exitcode=1 --leak-check=full \
                     --errors-for-leak-kinds=definite ./$t || exit 1
          done

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install analyzers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck clang-tools
      - name: cppcheck
        run: |
          cppcheck --std=c99 --enable=warning,performance,portability \
            --inline-suppr --error-exitcode=1 -q \
            -Iinclude src tools 2>cppcheck.txt || { cat cppcheck.txt; exit 1; }
          echo "cppcheck clean"
      - name: clang scan-build (library + tools)
        run: |
          scan-build -o scanout --status-bugs \
            make CC=clang libmv.a calibreal rigcalib scenecloud slreal \
                 annotate replaycam hubengine nettest genframes || \
            { echo "scan-build found issues"; exit 1; }

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build fuzzers (clang libFuzzer)
        run: make CC=clang fuzz_reader fuzz_pgm
      - name: fuzz the pattern reader
        run: ./fuzz_reader -max_total_time=120 -rss_limit_mb=2048 -print_final_stats=1
      - name: fuzz the PGM parser
        run: ./fuzz_pgm -max_total_time=90 -rss_limit_mb=2048 -print_final_stats=1

  multi-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        opt: [-O0, -O2, -O3]
    steps:
      - uses: actions/checkout@v4
      - name: build+test ${{ matrix.cc }} ${{ matrix.opt }}
        env:
          CFLAGS: -std=c99 -pedantic -Wall -Wextra -Werror ${{ matrix.opt }} -g
        run: |
          make CC=${{ matrix.cc }} libmv.a test_mv test_refine test_optimal \
               test_feat test_session test_photo test_bundle test_mux \
               test_tsdffast test_plane test_sync test_track
          for t in test_mv test_refine test_optimal test_feat test_session \
                   test_photo test_bundle test_mux test_tsdffast test_plane \
                   test_sync test_track; do ./$t >/dev/null || exit 1; done
          echo "${{ matrix.cc }} ${{ matrix.opt }}: all suites pass"
