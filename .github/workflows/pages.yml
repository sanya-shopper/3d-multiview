name: pages

# Publishes the GitHub Pages site: the site/ landing page at the root,
# the two interactive apps under web/, and the built document as
# multiview.pdf (repo rule W1: the site stays synced with the doc).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp site/index.html _site/
          cp -R web _site/web
          cp doc/multiview.pdf _site/multiview.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
